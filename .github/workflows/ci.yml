# dictate_v1 CI
#
# WHAT THIS PROVES, AND WHAT IT CANNOT
#
# dictate runs on one Windows PC with an AMD RX 6900 XT in it, and nobody who
# works on this repository has that machine - or any Windows machine, or any AMD
# GPU. So this workflow exists to catch everything that can be caught without
# one, on the same operating system the product actually runs on.
#
#   PROVED HERE  the Python package installs on Windows and its 672 tests pass;
#                the installer's own logic works on Windows PowerShell 5.1,
#                including a download that really is interrupted and resumed;
#                whisper.cpp compiles from source with the Vulkan backend on
#                Windows; the binary that comes out really transcribes audio;
#                dictate's resident-process supervision and HTTP client drive
#                that real binary end to end; sherpa-onnx loads and produces
#                live-caption text from real audio; Windows Task Scheduler
#                accepts the logon task and removing it leaves nothing behind;
#                a supervised child process is ended by Windows when its parent
#                is killed outright, which is what makes the orphaned
#                whisper-server impossible; and `dictate update` really fetches
#                THIS private repository over the GitHub CLI and replaces a real
#                editable install with what came back.
#
#   NOT PROVED   anything about the GPU. GitHub's hosted Windows runners have no
#                AMD card and no Vulkan driver, so Vulkan legitimately finds zero
#                devices here and whisper.cpp falls back to the processor. This
#                workflow is therefore built so that "it compiles and the tests
#                pass" is a separate result from "the GPU path runs", and it
#                never fails just because there is no GPU. A green tick on this
#                workflow is NOT evidence that the GPU works. Nothing else is
#                proved about the microphone, the global hotkey, the caption
#                overlay or pasting into other applications either - those need
#                a real desktop with a real person at it. Nor is the LOGON
#                proved: a runner never logs on, so the task registering is as
#                far as this can go - nobody here has watched it fire. Nor is
#                the SIGN-IN: the update job below borrows the workflow's own
#                token, so `gh auth login` opening a browser and Windows
#                remembering it afterwards is his first morning, not a test.

name: CI

on:
  # Pull requests cover the feature branches, so pushing to one does not also
  # start a second, identical run of a build that takes a quarter of an hour.
  push:
    branches: [main, 'fm/dictate-core-app']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  tests:
    name: Test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite takes about two minutes. This is here so that a test which
    # HANGS fails in ten rather than sitting for the default six hours: a
    # blocking Win32 call with nobody to answer it is the way to do that on
    # Windows, and it happened - a message box on a machine with no one to
    # click it.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dictate (core only - it has no third-party dependencies)
        run: python -m pip install -e .

      - name: Run the test suite
        # -u so the log names the test that is running rather than holding it in
        # a buffer. Without it a hang leaves no clue which test hung, because
        # stdout to a pipe is block-buffered and the last line never arrives.
        run: python -u -m unittest discover -s tests -t . -v

      - name: Command line, on a machine with nothing else installed
        shell: pwsh
        run: |
          # Programs like whisper.cpp, git and dictate itself write ordinary
          # progress to stderr. With PowerShell's default of stop-on-error that
          # can abort a step that is working perfectly, so exit codes are what
          # decide success here.
          $ErrorActionPreference = 'Continue'
          dictate --version
          dictate clean --explain "Um, so I was, you know, thinking about it."

          # Spoken punctuation, through the shipped rules. `--explain` is piped
          # on purpose: a redirected Windows console encodes with the local code
          # page rather than UTF-8, so a non-ASCII character in that report is a
          # UnicodeEncodeError here and nowhere a Linux machine would find it.
          $marks = dictate punctuate --rules config/voice-punctuation.toml --explain "hello comma world" 2>&1 | Out-String
          Write-Host $marks
          if ($marks -match 'Traceback') { throw 'dictate punctuate printed a stack trace' }
          if ($marks -notmatch 'hello, world') { throw "dictate punctuate did not punctuate: $marks" }

          # `doctor` is meant to report missing pieces, so a non-zero exit here
          # is the correct answer on a bare CI machine. What must never happen
          # is a stack trace: this whole command exists to be readable by
          # someone who is not a developer.
          $report = dictate --config config/dictate.example.toml doctor 2>&1 | Out-String
          Write-Host $report
          if ($report -match 'Traceback') {
            throw 'dictate doctor printed a stack trace instead of a report'
          }
          if ($report -notmatch 'What to do:') {
            throw 'dictate doctor did not tell the user what to do about its findings'
          }

          # How big the captions are, changed the way he changes it. This needs
          # no screen and no Windows - it reads and writes one line of a config
          # file - so the whole loop is checked here rather than on his machine.
          Copy-Item config/dictate.example.toml "$env:RUNNER_TEMP/look.toml"
          $look = dictate --config "$env:RUNNER_TEMP/look.toml" look 2>&1 | Out-String
          Write-Host $look
          if ($look -match 'Traceback') { throw 'dictate look printed a stack trace' }
          if ($look -notmatch 'compact') { throw 'dictate look did not say what size the captions are' }
          dictate --config "$env:RUNNER_TEMP/look.toml" look smaller | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'dictate look smaller failed' }
          $after = Get-Content "$env:RUNNER_TEMP/look.toml" -Raw
          if ($after -notmatch 'size = "small"') { throw 'dictate look smaller did not write the new size' }
          # And the file it wrote is still a config file, comments and all.
          if (($after -split "`n" | Where-Object { $_ -match '^#' }).Count -lt 20) {
            throw 'dictate look rewrote the config instead of editing one line'
          }
          dictate --config "$env:RUNNER_TEMP/look.toml" doctor 2>&1 | Out-Null

          # The commands that answer "is it running?" and "stop it now" have to
          # work when nothing is running, which is the state someone is in when
          # they are confused about whether anything is.
          $status = dictate autostart status 2>&1 | Out-String
          Write-Host $status
          if ($status -match 'Traceback') { throw 'autostart status printed a stack trace' }
          if ($status -notmatch 'running now:') { throw 'autostart status did not say whether dictate is running' }
          $stop = dictate stop 2>&1 | Out-String
          Write-Host $stop
          if ($stop -notmatch 'not running') { throw 'dictate stop did not report that nothing is running' }
          # It is the one command he is asked to remember, so it answers the
          # whole question - is anything of dictate's left anywhere - rather
          # than only the part about the lock.
          if ($stop -notmatch 'transcription port') { throw 'dictate stop did not say anything about the transcription port' }
          if ($LASTEXITCODE -ne 0) { throw "dictate stop failed on a machine with nothing running: $stop" }

          # What setup.ps1 calls before it tests the install.
          $stale = dictate stop --stale-only 2>&1 | Out-String
          Write-Host $stale
          if ($LASTEXITCODE -ne 0) { throw "dictate stop --stale-only failed with nothing running: $stale" }
          exit 0

  # =========================================================================
  orphan:
    name: A child cannot outlive its parent (real Windows, parent killed dead)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dictate
        run: python -m pip install -e .

      - name: The control - with no containment, the child DOES survive
        shell: pwsh
        run: |
          # This runs first and on purpose. If an orphan could not happen here
          # either, the next step would prove nothing at all: it would pass on a
          # machine where something else was killing the child. This is the
          # behaviour the product owner actually hit, reproduced.
          $ErrorActionPreference = 'Continue'
          $report = "$env:RUNNER_TEMP\orphan-control.json"
          $parent = Start-Process -FilePath python -PassThru -NoNewWindow -ArgumentList @(
            'scripts\ci\orphan-parent.py', '--port', '8351',
            '--stub', 'tests\stub_server.py', '--report', $report, '--no-guard')

          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $report) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $report)) { throw 'the control parent never started its child' }
          Start-Sleep -Milliseconds 300
          $ids = Get-Content $report -Raw | ConvertFrom-Json
          Write-Host "control: parent $($ids.parent), child $($ids.child), guarded $($ids.guarded)"
          if ($ids.guarded) { throw '--no-guard did not remove the containment' }

          Stop-Process -Id $parent.Id -Force
          Start-Sleep -Seconds 5
          $survivor = Get-Process -Id $ids.child -ErrorAction SilentlyContinue
          if (-not $survivor) {
            throw 'the UNGUARDED child died with its parent, so this test cannot tell whether the job object does anything'
          }
          Write-Host "The unguarded child ($($ids.child)) outlived its parent - which is the bug."
          "ORPHAN_PID=$($ids.child)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          taskkill /PID $ids.child /T /F 2>&1 | Out-String | Write-Host
          exit 0

      - name: With the job object, killing the parent takes the child with it
        shell: pwsh
        run: |
          # The acceptance criterion, as close as a runner can get to it: the
          # parent is ended with Stop-Process -Force, which is a
          # TerminateProcess. No signal handler, no atexit, no `finally` of
          # dictate's runs - exactly the case that made Ctrl+C at the "Terminate
          # batch job (Y/N)?" prompt leave whisper-server holding the port.
          $ErrorActionPreference = 'Continue'
          function Test-PortHeld([int]$Port) {
            $client = New-Object System.Net.Sockets.TcpClient
            try { $client.Connect('127.0.0.1', $Port); return $true }
            catch { return $false }
            finally { $client.Dispose() }
          }
          $report = "$env:RUNNER_TEMP\orphan-guarded.json"
          $parent = Start-Process -FilePath python -PassThru -NoNewWindow -ArgumentList @(
            'scripts\ci\orphan-parent.py', '--port', '8352',
            '--stub', 'tests\stub_server.py', '--report', $report)

          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $report) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $report)) { throw 'the parent never started its child' }
          Start-Sleep -Milliseconds 300
          $ids = Get-Content $report -Raw | ConvertFrom-Json
          Write-Host "guarded: parent $($ids.parent), child $($ids.child)"
          Write-Host "containment: $($ids.guard)"
          if (-not $ids.guarded) { throw 'there was no containment on this run' }

          # It really is up and really is holding the port before anything is killed.
          if (-not (Get-Process -Id $ids.child -ErrorAction SilentlyContinue)) {
            throw 'the child was not running before the parent was killed'
          }
          if (-not (Test-PortHeld 8352)) { throw 'the child was not holding the port before the parent was killed' }

          Stop-Process -Id $parent.Id -Force

          $gone = $false
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) {
            if (-not (Get-Process -Id $ids.child -ErrorAction SilentlyContinue)) { $gone = $true; break }
            Start-Sleep -Milliseconds 250
          }
          if (-not $gone) {
            taskkill /PID $ids.child /T /F 2>&1 | Out-String | Write-Host
            throw "the child ($($ids.child)) outlived its parent - an orphan is still possible"
          }
          # The port gets the same bounded wait the process just got, and for
          # the same reason. A process disappears from Get-Process the moment it
          # is terminated, but Windows finishes tearing its listening socket
          # down a moment later, so probing the port ONCE at that instant is a
          # race - and it is a race this test loses more often the FASTER the
          # job object works, which is exactly the wrong way round for a check
          # whose job is to prove the job object works. It failed here twice in
          # five minutes on two unrelated branches, both times about 0.3s after
          # the child was confirmed up and holding the port, with the child
          # already correctly dead. Nothing about the containment was wrong on
          # either run.
          #
          # "Within seconds" is also the claim being made - the summary below
          # says so, and what matters to the product owner is that the next
          # dictate can bind the port, not which microsecond it came free.
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $free = $false
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) {
            if (-not (Test-PortHeld 8352)) { $free = $true; break }
            Start-Sleep -Milliseconds 250
          }
          if (-not $free) {
            # Say who has it. A socket the kernel has not finished closing has
            # no owning process left to name; a real orphan does, and that is
            # the difference between this check being noise and being the thing
            # that catches the bug coming back.
            Write-Host 'port 8352 is still held 20s after the child died. netstat says:'
            netstat -ano | Select-String ':8352' | Out-String | Write-Host
            throw 'the child is gone but something is still holding the port'
          }
          Write-Host "The parent was killed without any cleanup, Windows ended the child with it, and port 8352 came free $([int]$sw.ElapsedMilliseconds) ms later."
          exit 0

      - name: Leave nothing behind even if a step above failed
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:ORPHAN_PID) { taskkill /PID $env:ORPHAN_PID /T /F 2>&1 | Out-Null }
          exit 0

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          @'
          ### Orphaned transcription process

          **Proved on real Windows:** a child started through dictate's own
          `ManagedProcess` is put in a job object, and when its parent is ended
          with `Stop-Process -Force` - a `TerminateProcess`, so none of dictate's
          shutdown code runs at all - Windows ends the child too and the port is
          free within seconds. The same test with the containment removed
          (`--no-guard`) shows the child surviving, which is the bug being fixed
          and is what makes the first result mean anything.

          **Not proved, and cannot be here:** the exact keystroke path. Nobody
          has pressed Ctrl+C in a window running `dictate run` and answered `Y`
          to "Terminate batch job (Y/N)?" on a machine with a GPU and a real
          whisper-server. What is proved is the mechanism underneath it - the
          parent dying with no chance to clean up - which is the only thing that
          case does differently.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # =========================================================================
  autostart:
    name: Logon task (registers on real Windows; nothing here ever logs on)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dictate
        run: python -m pip install -e .

      - name: Windows Task Scheduler accepts the task dictate registers
        shell: pwsh
        run: |
          # This is the one thing about autostart that cannot be checked off
          # Windows: whether Task Scheduler will take the XML at all. A typo in
          # a setting name, a delay in the wrong format or a UserId Windows does
          # not recognise are all rejected here, and all of them would otherwise
          # only show up on the product owner's machine.
          #
          # It does NOT prove the task fires: a hosted runner never logs on.
          $ErrorActionPreference = 'Continue'
          $out = dictate autostart enable 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dictate autostart enable failed: $out" }
          if ($out -notmatch '1.6 GB') { throw 'enable did not state what it costs to leave on' }

          # Windows' own view of it, not dictate's. Note that this is NOT the
          # XML dictate sent: Task Scheduler normalises it, reordering the
          # document and dropping every element whose value is already the
          # default - which is why <RunLevel>LeastPrivilege</RunLevel> is not in
          # what comes back. It is the default, and its absence IS the answer.
          # So privilege is checked by what must NOT be there instead.
          $query = schtasks /Query /TN dictate /XML 2>&1 | Out-String
          Write-Host $query
          if ($LASTEXITCODE -ne 0) { throw 'the task is not registered with Windows' }
          foreach ($needed in @('LogonTrigger', 'PT30S', 'InteractiveToken',
                                'IgnoreNew', 'PT0S', 'pythonw.exe', 'run --autostart')) {
            if ($query -notmatch [regex]::Escape($needed)) {
              throw "the registered task lost '$needed' on the way into Windows"
            }
          }
          # The one that would be a real problem: asking for administrator
          # rights at every logon. Nothing dictate does at run time needs them.
          if ($query -match 'HighestAvailable') {
            throw 'the registered task asks to run elevated'
          }

          # And dictate reading Windows' answer back - the parsing that tells
          # him "is it on?" and "did it start?".
          $status = dictate autostart status 2>&1 | Out-String
          Write-Host $status
          if ($status -notmatch 'start at logon:  ON') { throw 'status did not report the task as on' }
          if ($status -match 'could not read') { throw 'status could not parse what schtasks said' }
          if ($status -notmatch 'pythonw\.exe') { throw 'status did not read back what the task runs' }

      - name: Turning it off leaves nothing behind
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = dictate autostart disable 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dictate autostart disable failed: $out" }

          schtasks /Query /TN dictate 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'the task is still registered after disable' }

          $status = dictate autostart status 2>&1 | Out-String
          Write-Host $status
          if ($status -notmatch 'start at logon:  OFF') { throw 'status did not report it as off' }

          # Twice must be safe: he will run it again when he is not sure.
          $again = dictate autostart disable 2>&1 | Out-String
          Write-Host $again
          if ($LASTEXITCODE -ne 0) { throw 'disabling something already disabled failed' }
          if ($again -notmatch 'Nothing to undo') { throw 'a second disable did not say there was nothing to do' }

      - name: Leave no task behind even if a step above failed
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          schtasks /Delete /TN dictate /F 2>&1 | Out-Null
          exit 0

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          @'
          ### Logon task

          **Proved on real Windows:** Task Scheduler accepts the task
          `dictate autostart enable` builds, and the settings that matter survive
          into it - the logon trigger, `InteractiveToken`, `LeastPrivilege`,
          `IgnoreNew`, and the windowless interpreter. `dictate autostart status`
          reads Windows' own answer back and reports it. `disable` removes it,
          Windows agrees it is gone, and running it twice is safe.

          **Not proved, and cannot be here:** that it starts at logon. A hosted
          runner never logs on, so nobody has seen the task fire, seen dictate
          come up in an interactive session, or confirmed that no console window
          appears. That is the first morning on the product owner's PC.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # =========================================================================
  update:
    name: dictate update (fetches this private repo for real, on Windows)
    # A fork's pull request has neither this branch nor a token that can read a
    # private repository, so the job would fail for a reason that is not a fault.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # This is what stands in for his sign-in, and it is the ONLY part of the
      # authentication this can exercise: `gh` reads a token from the
      # environment here, where on his PC it reads the one Windows remembers
      # after `gh auth login`. Everything past that point - the API calls, the
      # source archive, the private repository being visible at all - is
      # identical, and is genuinely proved below.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: this job seeds an install with an older revision
          # so that "what changed" is a real answer about real commits.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: An install of its own, so nothing here updates the checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Set here rather than in the job's `env:`, where the `runner` context
          # is not available and the whole workflow fails to start.
          "DICTATE_STATE_DIR=$env:RUNNER_TEMP\dictate-state" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $install = "$env:RUNNER_TEMP\dictate-install"
          robocopy . $install /E /XD .git /NFL /NDL /NJH /NJS /NP | Out-Null
          # robocopy uses 0-7 for success and 8 upwards for failure.
          if ($LASTEXITCODE -ge 8) { throw "could not copy the checkout ($LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
          python -m pip install -e $install
          if ($LASTEXITCODE -ne 0) { throw 'the throwaway install failed' }
          "DICTATE_INSTALL=$install" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # `dictate update` finds the folder Python loads it from, not a name.
          # If that is not the copy above, everything below would pass while
          # updating the wrong folder - which is the exact confusion the command
          # exists to end, so it is checked before anything else runs.
          $loaded = python -c "import dictate; print(dictate.__file__)"
          Write-Host "dictate loads from $loaded"
          if ($loaded -notlike "$install*") {
            throw "python loads dictate from $loaded, not from the copy this job made"
          }
          exit 0

      - name: Make that install stale, the way his ZIP install is stale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $install = $env:DICTATE_INSTALL
          $branch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          git fetch --no-tags origin $branch
          $head = (git rev-parse FETCH_HEAD).Trim()
          $base = (git rev-parse "$head~3").Trim()
          # A subject from the range that is not a merge, so the assertion is
          # about a line he would actually read rather than about bookkeeping.
          $expect = (git log --no-merges --format=%s "$base..$head" | Select-Object -First 1)
          Write-Host "branch $branch, updating from $base to $head"
          Write-Host "expecting to be told about: $expect"

          # Two differences from the current source, so the update has real work:
          # a file whose content is behind, and a file that no longer exists
          # upstream (which only gets removed because it is in the record below).
          Add-Content -LiteralPath "$install\README.md" -Value 'a line from an older version'
          Set-Content -LiteralPath "$install\src\dictate\_ci_removed_upstream.py" -Value '# not in the current source'

          # Exactly what setup.ps1 does at install time, and the reason it is
          # done by dictate rather than in PowerShell: the checksums have to be
          # taken over the same files the update compares.
          python -c "import sys, dictate.update as u; print(u.record_install(sys.argv[1], root=sys.argv[2]))" $base $install
          if ($LASTEXITCODE -ne 0) { throw 'recording the install failed' }

          "UPDATE_BRANCH=$branch"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UPDATE_HEAD=$head"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UPDATE_BASE=$base"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UPDATE_EXPECT=$expect"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: It fetches this private repository and installs what came back
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $install = $env:DICTATE_INSTALL

          $out = dictate update --repo $env:GITHUB_REPOSITORY --branch $env:UPDATE_BRANCH 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dictate update failed: $out" }
          if ($out -match 'Traceback') { throw 'dictate update printed a stack trace' }

          # It said what changed, in the words of the commits themselves.
          if ($env:UPDATE_EXPECT) {
            if ($out -notmatch [regex]::Escape($env:UPDATE_EXPECT)) {
              throw "the update did not report the change '$($env:UPDATE_EXPECT)'"
            }
          } else {
            Write-Host 'No non-merge commit in the range, so nothing to assert about the list.'
          }

          # It really changed the files.
          $readme = Get-Content -LiteralPath "$install\README.md" -Raw
          if ($readme -match 'a line from an older version') {
            throw 'the update reported success without replacing the file'
          }
          # And really removed one the current source does not have.
          if (Test-Path -LiteralPath "$install\src\dictate\_ci_removed_upstream.py") {
            throw 'a file that is no longer in the source was left behind'
          }

          # It recorded which revision this now is, which is the thing
          # `dictate --version` can never say.
          $record = Get-Content -LiteralPath "$install\.dictate-install.json" -Raw | ConvertFrom-Json
          if ($record.revision -ne $env:UPDATE_HEAD) {
            throw "recorded $($record.revision), expected $($env:UPDATE_HEAD)"
          }

          # It never rebuilt whisper.cpp, re-downloaded a model or ran the
          # toolchain. That distinction is the whole value of the command.
          foreach ($forbidden in @('whisper\.cpp', 'Downloading', 'winget install')) {
            if ($out -match $forbidden) { throw "the update did work it was not asked for: $forbidden" }
          }

          # And nothing that looks like a credential reached the screen.
          if ($env:GH_TOKEN -and $out.Contains($env:GH_TOKEN)) {
            throw 'the update printed the token'
          }
          exit 0

      - name: Running it again is one second and says so
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = dictate update --repo $env:GITHUB_REPOSITORY --branch $env:UPDATE_BRANCH 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "a second update failed: $out" }
          if ($out -notmatch 'already up to date') { throw 'it did not say it was up to date' }

          $check = dictate update --repo $env:GITHUB_REPOSITORY --branch $env:UPDATE_BRANCH --check 2>&1 | Out-String
          Write-Host $check
          if ($LASTEXITCODE -ne 0) { throw "--check failed: $check" }
          exit 0

      - name: A file he has edited stops it, and --force keeps a copy first
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $install = $env:DICTATE_INSTALL

          # Put it back in the "an update is pending" state, then edit a file.
          python -c "import sys, dictate.update as u; u.record_install(sys.argv[1], root=sys.argv[2])" $env:UPDATE_BASE $install
          Set-Content -LiteralPath "$install\README.md" -Value 'notes I typed myself'

          $out = dictate update --repo $env:GITHUB_REPOSITORY --branch $env:UPDATE_BRANCH 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) { throw 'it overwrote an edited file without saying anything' }
          if ($out -notmatch 'README\.md') { throw 'it did not name the file that would be overwritten' }
          if ($out -notmatch '--force') { throw 'it did not say how to go ahead anyway' }
          $kept = Get-Content -LiteralPath "$install\README.md" -Raw
          if ($kept -notmatch 'notes I typed myself') { throw 'it changed the file it had just refused to change' }

          $forced = dictate update --repo $env:GITHUB_REPOSITORY --branch $env:UPDATE_BRANCH --force 2>&1 | Out-String
          Write-Host $forced
          if ($LASTEXITCODE -ne 0) { throw "--force failed: $forced" }
          $now = Get-Content -LiteralPath "$install\README.md" -Raw
          if ($now -match 'notes I typed myself') { throw '--force did not update the file' }
          exit 0

      - name: And there is a way back
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $install = $env:DICTATE_INSTALL
          $out = dictate update --restore 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "--restore failed: $out" }
          $back = Get-Content -LiteralPath "$install\README.md" -Raw
          if ($back -notmatch 'notes I typed myself') {
            throw 'the version that was there before --force was not put back'
          }
          # The restored copy is a working install, and it says which one it is.
          python -c "import dictate.cli; print(dictate.cli.__file__)"
          if ($LASTEXITCODE -ne 0) { throw 'the restored install does not import' }
          $doctor = dictate doctor 2>&1 | Out-String
          if ($doctor -match 'Traceback') { throw 'doctor printed a stack trace after a restore' }
          if ($doctor -notmatch 'Install folder') { throw 'doctor did not say which folder dictate loads from' }
          # `dictate doctor` exits 1 on a machine with no model and no
          # whisper-server, which is the correct answer here and not a failure of
          # this step - so the step's own result is stated rather than inherited.
          exit 0

      - name: With no sign-in it says what to type, and prints nothing else
        shell: pwsh
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          $ErrorActionPreference = 'Continue'
          # The state he is in the very first time, reproduced: the GitHub CLI is
          # installed and nothing is signed in. The message has to name the one
          # command that fixes it, because nobody can guess `gh auth login`.
          $out = dictate update --repo $env:GITHUB_REPOSITORY --check 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) { throw 'it claimed to work with nothing signed in' }
          if ($out -match 'Traceback') { throw 'it printed a stack trace instead of a message' }
          if ($out -notmatch 'gh auth login') { throw 'it did not say how to sign in' }
          if ($out -notmatch '(?i)sign in') { throw 'it did not say plainly that a sign-in is needed' }
          exit 0

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          @'
          ### dictate update

          **Proved on real Windows, against this private repository:** the
          GitHub CLI reads it, the source archive for a specific revision comes
          back and unpacks, and a real editable install is replaced with what
          came back - a file behind the current source is brought forward, a
          file no longer in the source is removed, the revision is recorded, and
          the commit subjects between the two revisions are reported. Running it
          again answers "already up to date". A file edited in the install folder
          stops it by name; `--force` goes ahead and keeps a complete copy;
          `--restore` puts that copy back and the result imports. With nothing
          signed in, it names `gh auth login` rather than failing obscurely.
          Nothing in any of it rebuilds whisper.cpp, downloads a model or runs
          the toolchain.

          **Not proved, and cannot be here:** the sign-in itself. This job
          borrows the workflow's own token, so `gh auth login` opening a browser
          and Windows remembering it afterwards has never been run by anybody -
          that is his first morning. Nor is a real interruption: the roll-back is
          driven here by a version that will not import, and by the unit tests
          off Windows, rather than by pulling the power out half way.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # =========================================================================
  installer-logic:
    name: Installer logic (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Every PowerShell file parses
        shell: powershell
        run: |
          # The product owner runs these with the PowerShell that ships with
          # Windows, so they are parsed with exactly that, not PowerShell 7.
          $bad = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse |
            Where-Object { $_.FullName -notmatch '\\(\.git|whisper\.cpp)\\' } |
            ForEach-Object {
              $errors = $null
              $tokens = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors) {
                $bad++
                Write-Host "FAIL $($_.FullName)"
                $errors | ForEach-Object { Write-Host "     line $($_.Extent.StartLineNumber): $($_.Message)" }
              } else {
                Write-Host "ok   $($_.FullName)"
              }
            }
          if ($bad -gt 0) { throw "$bad PowerShell file(s) would not parse" }

      - name: The model list is readable and every fingerprint is a SHA-256
        shell: powershell
        run: |
          $models = Import-PowerShellDataFile scripts\models.psd1
          foreach ($key in $models.Keys) {
            $entry = $models[$key]
            Write-Host "$key : $($entry.Name)  $($entry.Bytes) bytes  $($entry.Sha256)"
            if ($entry.Sha256 -notmatch '^[0-9a-f]{64}$') { throw "$key has no usable SHA-256" }
            if ($entry.Bytes -le 0) { throw "$key has no size" }
            if ($entry.Uri -notmatch '^https://') { throw "$key is not fetched over https" }
          }

      - name: Installer unit tests, including a download that really is interrupted
        shell: powershell
        run: |
          .\scripts\tests\setup-lib.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'installer tests failed' }

      - name: setup.ps1 reports a missing tool in plain language rather than crashing
        shell: powershell
        run: |
          # Programs like whisper.cpp, git and dictate itself write ordinary
          # progress to stderr. With PowerShell's default of stop-on-error that
          # can abort a step that is working perfectly, so exit codes are what
          # decide success here.
          $ErrorActionPreference = 'Continue'
          # Run the build step with nothing set up. It must stop, with a problem
          # and a next action, and no stack trace - that behaviour is the whole
          # promise of the installer, so it is tested rather than assumed.
          # This runner has no Vulkan SDK anywhere, which makes it the genuine
          # not-installed state.
          $env:VULKAN_SDK = ''
          $env:VK_SDK_PATH = ''
          $output = & powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 `
            -Only build -Root "$env:RUNNER_TEMP\dictate-refuses" 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -eq 0) { throw 'setup.ps1 carried on without the Vulkan SDK' }
          if ($output -match 'at <ScriptBlock>|System\.Management\.Automation') {
            throw 'setup.ps1 showed the user a stack trace'
          }
          if ($output -notmatch 'What to do:') {
            throw 'setup.ps1 stopped without telling the user what to do'
          }
          # The bug this replaced: with no SDK on the machine, setup claimed one
          # had installed and asked for a reboot that could never help. On a
          # runner with no SDK, saying either of those would be a lie.
          if ($output -match 'installed, but Windows has not made it visible') {
            throw 'setup.ps1 claimed the Vulkan SDK installed when it is not on this machine'
          }
          if ($output -match '(?i)restart the pc[\s,]*(and|then)\s+run') {
            throw 'setup.ps1 told the user to restart the PC to fix software that was never installed'
          }
          if ($output -notmatch 'not installed on this PC') {
            throw 'setup.ps1 did not say plainly that the Vulkan SDK is not installed'
          }
          if ($output -notmatch 'vulkan\.lunarg\.com') {
            throw 'setup.ps1 did not give the user a download address that works'
          }
          exit 0

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          @'
          ### Installer logic

          Ran on Windows PowerShell 5.1, the version that ships with Windows.

          Covered: version detection, Vulkan SDK detection and every branch of
          what it says, the config-file edit (against the real
          `config/dictate.example.toml`, re-read afterwards by Python's TOML
          parser), integrity checking, and the resumable downloader against a
          local HTTP server that genuinely drops the connection mid-transfer.

          Not covered: winget installing the toolchain, the direct download of
          the Vulkan SDK from LunarG and the Authenticode check on it, and
          anything that needs a GPU or a desktop.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # =========================================================================
  windows-packages:
    name: Windows packages + live captions (CPU)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dictate with its Windows packages
        run: python -m pip install -e ".[windows]"

      - name: Everything the Windows install needs actually imports
        shell: pwsh
        run: |
          # Not a formality: sherpa-onnx and global-hotkeys are the two packages
          # that had never been installed anywhere when dictate was written.
          python -c "import sounddevice; print('sounddevice', sounddevice.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import sherpa_onnx; print('sherpa-onnx', getattr(sherpa_onnx, '__version__', 'unknown'))"
          python -c "import global_hotkeys; print('global-hotkeys imported')"

      - name: Cache the live-caption model
        id: caption-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: caption-model-sherpa-zipformer-en-2023-06-26

      - name: Download the live-caption model, through the installer's own downloader
        if: steps.caption-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          . .\scripts\setup-lib.ps1
          $models = Import-PowerShellDataFile scripts\models.psd1
          $captions = $models.Captions
          $dir = "$env:RUNNER_TEMP\models"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $archive = Join-Path $dir 'caption-model.tar.bz2'
          Get-FileResumable -Uri $captions.Uri -Destination $archive `
            -ExpectedBytes $captions.Bytes -ExpectedSha256 $captions.Sha256 -Label $captions.Label
          tar -xf $archive -C $dir
          if ($LASTEXITCODE -ne 0) { throw 'could not unpack the caption model' }
          Remove-Item $archive -Force
          foreach ($file in $captions.Files) {
            $path = Join-Path $dir (Join-Path $captions.Name $file)
            if (-not (Test-Path -LiteralPath $path)) { throw "the model is missing $file" }
          }

      - name: The live-caption engine turns real audio into words
        shell: pwsh
        run: |
          $models = Import-PowerShellDataFile scripts\models.psd1
          $dir = Join-Path "$env:RUNNER_TEMP\models" $models.Captions.Name
          $config = "$env:RUNNER_TEMP\captions.toml"
          @"
          [captions]
          enabled = true
          model_dir = '$dir'
          num_threads = 2
          provider = "cpu"
          "@ | Set-Content -LiteralPath $config -Encoding UTF8
          python scripts\ci\caption-smoke.py $config assets\jfk.wav country

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          @'
          ### Windows packages + live captions

          Proved: `pip install -e ".[windows]"` resolves and installs on Windows;
          sounddevice, numpy, sherpa-onnx and global-hotkeys all import; the
          streaming Zipformer loads and turns the bundled clip into caption text;
          and closing a caption session destroys that text, which is what keeps
          it out of the document.

          Not proved: the caption **overlay** - the always-on-top, click-through,
          never-focused window - which needs a real desktop. Nor the microphone
          or the global hotkey.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # =========================================================================
  whisper-vulkan:
    name: whisper.cpp Vulkan build (compiles here; no GPU to run it on)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Where the build goes
        shell: pwsh
        run: |
          # Outside the checkout, so the whisper.cpp source tree is not mistaken
          # for part of this repository by anything that walks it.
          "DICTATE_ROOT=$env:RUNNER_TEMP\dictate-gpu" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache the Vulkan SDK
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\current
          # Bump the suffix to pick up a newer SDK.
          key: vulkan-sdk-windows-v1

      - name: Install the Vulkan SDK
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # From LunarG directly, not from a third party - the same source the
          # installer's `winget install KhronosGroup.VulkanSDK` ends up at, and
          # the same address setup.ps1 falls back to when winget cannot install
          # it. Both are LunarG's own documented download endpoint.
          $installer = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '--root', 'C:\VulkanSDK\current',
            '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($process.ExitCode -ne 0) { throw "the Vulkan SDK installer exited $($process.ExitCode)" }

      - name: Put the Vulkan SDK on PATH
        shell: pwsh
        run: |
          $sdk = 'C:\VulkanSDK\current'
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) {
            Get-ChildItem $sdk -ErrorAction SilentlyContinue | Out-String | Write-Host
            throw "the Vulkan SDK is not where it should be (no $sdk\Bin\glslc.exe)"
          }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: The installer finds a real Vulkan SDK without being told where it is
        shell: powershell
        run: |
          # The only place in this workflow with a genuine LunarG SDK on disk,
          # so it is the only place the fix for the "installed, but Windows has
          # not announced it" bug can be checked against the real thing rather
          # than against a folder of empty files.
          . .\scripts\setup-lib.ps1
          $sdk = 'C:\VulkanSDK\current'

          if (-not (Test-VulkanSdkDir $sdk)) {
            Get-ChildItem $sdk | Out-String | Write-Host
            throw "a real SDK at $sdk was not recognised as one"
          }
          if (-not (Test-VulkanShaderCompiler $sdk)) { throw 'glslc was not found in a real SDK' }

          # The state the product owner was actually in: the SDK is on the
          # machine and no environment variable points at it. It must be found
          # anyway, and this window pointed at it, with nothing restarted.
          $env:VULKAN_SDK = ''
          $env:VK_SDK_PATH = ''
          $found = Resolve-VulkanSdk -SearchRoots @('C:\VulkanSDK') -Sources @('session','disk')
          if (-not $found) { throw 'a real installed SDK was not found with VULKAN_SDK unset' }
          if ($found.Source -ne 'disk') { throw "expected to find it on disk, got $($found.Source)" }
          if ($found.Path -ne $sdk) { throw "found $($found.Path), expected $sdk" }

          Set-VulkanSdkForSession -Path $found.Path
          if ($env:VULKAN_SDK -ne $sdk) { throw 'VULKAN_SDK was not set for this session' }
          Write-Host "Found and adopted a real Vulkan SDK with no variable set: $($found.Path)"

      - name: Build whisper.cpp with Vulkan, using the installer's own build step
        shell: powershell
        run: |
          # -Only build runs exactly the code the product owner's machine runs.
          # It is not a copy of the commands: if this passes and his machine
          # fails, the difference is his machine, not a stale script.
          & .\setup.ps1 -Only build -Root "$env:DICTATE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'the whisper.cpp Vulkan build failed' }

      - name: What came out of the build
        shell: pwsh
        run: |
          $bin = "$env:DICTATE_ROOT\whisper.cpp\build\bin\Release"
          Get-ChildItem "$bin\*.exe" | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          foreach ($needed in @('whisper-server.exe', 'whisper-cli.exe')) {
            if (-not (Test-Path "$bin\$needed")) { throw "$needed was not built" }
          }
          # The Vulkan backend has to be IN the build, not merely requested.
          $cache = "$env:DICTATE_ROOT\whisper.cpp\build\CMakeCache.txt"
          if (-not (Select-String -Path $cache -Pattern '^GGML_VULKAN:BOOL=(ON|1|TRUE)$' -Quiet)) {
            throw 'the build was configured without GGML_VULKAN'
          }
          $vulkanLib = Get-ChildItem "$bin\ggml-vulkan*" -ErrorAction SilentlyContinue
          if (-not $vulkanLib) { throw 'no ggml-vulkan library was produced' }
          Write-Host "Vulkan backend built: $($vulkanLib.Name -join ', ')"

      - name: How much of the GPU path this machine can see (informational, never fails)
        shell: pwsh
        run: |
          # Programs like whisper.cpp, git and dictate itself write ordinary
          # progress to stderr. With PowerShell's default of stop-on-error that
          # can abort a step that is working perfectly, so exit codes are what
          # decide success here.
          $ErrorActionPreference = 'Continue'
          $summary = & "$env:VULKAN_SDK\Bin\vulkaninfoSDK.exe" --summary 2>&1 | Out-String
          $devices = @([regex]::Matches($summary, 'deviceName\s*=\s*(.+)') |
            ForEach-Object { $_.Groups[1].Value.Trim() })
          Write-Host "Vulkan devices on this runner: $($devices.Count)"
          $devices | ForEach-Object { Write-Host "  $_" }
          if ($devices.Count -eq 0) {
            Write-Host ''
            Write-Host 'Zero devices is the expected and correct result here: GitHub hosted'
            Write-Host 'runners have no GPU and no Vulkan driver. whisper.cpp will fall back to'
            Write-Host 'the processor, which is what the next steps exercise. This says nothing'
            Write-Host 'about whether the RX 6900 XT works.'
          }
          exit 0

      - name: Cache the smoke-test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-models
          key: ci-whisper-model-base-en

      - name: Download the smoke-test model, through the installer's own downloader
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          . .\scripts\setup-lib.ps1
          $models = Import-PowerShellDataFile scripts\models.psd1
          $model = $models.CiSmoke
          $dir = "$env:RUNNER_TEMP\ci-models"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Get-FileResumable -Uri $model.Uri -Destination (Join-Path $dir $model.Name) `
            -ExpectedBytes $model.Bytes -ExpectedSha256 $model.Sha256 -Label $model.Label

      - name: The binary that was just built really transcribes audio
        shell: pwsh
        run: |
          # Programs like whisper.cpp, git and dictate itself write ordinary
          # progress to stderr. With PowerShell's default of stop-on-error that
          # can abort a step that is working perfectly, so exit codes are what
          # decide success here.
          $ErrorActionPreference = 'Continue'
          $models = Import-PowerShellDataFile scripts\models.psd1
          $model = Join-Path "$env:RUNNER_TEMP\ci-models" $models.CiSmoke.Name
          $cli = "$env:DICTATE_ROOT\whisper.cpp\build\bin\Release\whisper-cli.exe"
          # No -fa / --flash-attn: whisper.cpp #3806 is whisper-server crashing
          # inside AMD's amdvlk64.dll with it on. It is off everywhere on purpose.
          $out = & $cli -m $model -f assets\jfk.wav -t 4 -bs 1 -bo 1 -nt 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch '(?i)country') {
            throw 'the built binary did not transcribe the test clip correctly'
          }
          Write-Host 'The Vulkan-enabled build transcribes correctly on the processor.'

      - name: Install dictate
        run: python -m pip install -e .

      - name: dictate drives the real whisper-server end to end (processor, not GPU)
        shell: pwsh
        run: |
          # Programs like whisper.cpp, git and dictate itself write ordinary
          # progress to stderr. With PowerShell's default of stop-on-error that
          # can abort a step that is working perfectly, so exit codes are what
          # decide success here.
          $ErrorActionPreference = 'Continue'
          # This is the part of dictate that cannot be tested off Windows: the
          # resident process supervision, the health wait, the WAV encoding and
          # the HTTP client, all against the real whisper-server that was just
          # compiled. use_gpu is false because this machine has no GPU - the
          # code path either side of the backend choice is identical.
          $models = Import-PowerShellDataFile scripts\models.psd1
          $model = Join-Path "$env:RUNNER_TEMP\ci-models" $models.CiSmoke.Name
          $server = "$env:DICTATE_ROOT\whisper.cpp\build\bin\Release\whisper-server.exe"
          $config = "$env:RUNNER_TEMP\dictate-ci.toml"
          @"
          [whisper]
          server_exe = '$server'
          model = '$model'
          use_gpu = false
          threads = 4
          startup_timeout_s = 300.0

          [captions]
          enabled = false

          [logging]
          level = "INFO"
          file = '$env:RUNNER_TEMP\dictate-ci.log'
          "@ | Set-Content -LiteralPath $config -Encoding UTF8

          $out = dictate --config $config transcribe assets\jfk.wav --repeat 1 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw 'dictate could not drive whisper-server' }
          if ($out -notmatch '(?i)country') { throw 'dictate got the wrong text back' }
          Write-Host 'Resident whisper-server, started and driven by dictate itself: works.'
          exit 0

      - name: What GPU mode does on a machine with no GPU (informational, never fails)
        continue-on-error: true
        shell: pwsh
        run: |
          # Programs like whisper.cpp, git and dictate itself write ordinary
          # progress to stderr. With PowerShell's default of stop-on-error that
          # can abort a step that is working perfectly, so exit codes are what
          # decide success here.
          $ErrorActionPreference = 'Continue'
          # The product owner's machine runs with use_gpu = true. Here that can
          # only show what happens when Vulkan finds nothing - it is recorded
          # because a graceful fall back to the processor is worth knowing about,
          # and a crash would be worth knowing about even more. It is NOT a test
          # of the GPU path, and it cannot fail this workflow.
          $models = Import-PowerShellDataFile scripts\models.psd1
          $model = Join-Path "$env:RUNNER_TEMP\ci-models" $models.CiSmoke.Name
          $server = "$env:DICTATE_ROOT\whisper.cpp\build\bin\Release\whisper-server.exe"
          $config = "$env:RUNNER_TEMP\dictate-ci-gpu.toml"
          @"
          [whisper]
          server_exe = '$server'
          model = '$model'
          use_gpu = true
          threads = 4
          startup_timeout_s = 300.0

          [captions]
          enabled = false
          "@ | Set-Content -LiteralPath $config -Encoding UTF8

          $out = dictate --config $config transcribe assets\jfk.wav --repeat 1 2>&1 | Out-String
          Write-Host $out
          if ($out -match '(?i)country') {
            Write-Host 'With use_gpu = true and no GPU present, it fell back to the processor and still worked.'
          } else {
            Write-Host 'With use_gpu = true and no GPU present, it did not produce a transcript here.'
            Write-Host 'That is not a verdict on the real machine, which has a GPU.'
          }
          exit 0

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          @'
          ### whisper.cpp Vulkan build

          **Proved on real Windows:** whisper.cpp compiles from source with
          `-DGGML_VULKAN=1`, the Vulkan backend library is in the build,
          `whisper-server.exe` and `whisper-cli.exe` come out of it, the binary
          transcribes the bundled clip correctly, and dictate itself starts and
          drives that real `whisper-server` over HTTP end to end.

          **Not proved, and cannot be:** that any of it runs on a GPU. This
          runner has no AMD card and no Vulkan driver, so Vulkan reports zero
          devices and every transcription above ran on the processor. Whether
          the RX 6900 XT is used, and how fast it is, can only be answered on the
          machine that has one - `dictate transcribe` prints that number in about
          a minute.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
